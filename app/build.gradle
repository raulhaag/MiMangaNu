apply plugin: 'com.android.application'

android {
    compileSdkVersion 28
    buildToolsVersion '28.0.3'

    defaultConfig {
        applicationId "ar.rulosoft.mimanganu"
        minSdkVersion 15
        targetSdkVersion 28
        versionCode 105
        versionName "1.105"

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file("../mimanganu.jks")
            storePassword 'mimanganu'
            keyAlias 'mimanganu'
            keyPassword 'mimanganu'
        }
        debug {
            storeFile file("../mimanganu.jks")
            storePassword 'mimanganu'
            keyAlias 'mimanganu'
            keyPassword 'mimanganu'
        }
    }

    sourceSets {
        test {
            java.srcDirs += "$projectDir/src/testShare"
        }

        androidTest {
            java.srcDirs += "$projectDir/src/testShare"

        }
    }

    buildTypes {
        release {
            lintOptions {
                disable 'MissingTranslation'
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
            signingConfig signingConfigs.debug
        }
    }

    flavorDimensions "builds"
    productFlavors {
        fdroid {
            signingConfig signingConfigs.release
            dimension "builds"
        }
        github {
            signingConfig signingConfigs.release
            //removed to maintain updates as now are
            versionNameSuffix '-github'
            dimension "builds"
        }
    }

    compileOptions {
        encoding = 'UTF-8'
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        disable 'GoogleAppIndexingWarning'
    }

    packagingOptions {
        exclude 'META-INF/*'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    fdroidApi project(':fakegps')
    api project(':imageviewtouchlibrary')

    final ANDROID_SUPPORT = '28.0.0'
    implementation "com.android.support:design:$ANDROID_SUPPORT"
    implementation "com.android.support:support-v4:$ANDROID_SUPPORT"
    implementation "com.android.support:appcompat-v7:$ANDROID_SUPPORT"
    implementation "com.android.support:preference-v7:$ANDROID_SUPPORT"
    implementation "com.android.support:recyclerview-v7:$ANDROID_SUPPORT"

    //implementation 'com.github.junrar:junrar:4.0.0'

    implementation 'rapid.decoder:library:0.3.0'
    implementation 'rapid.decoder:jpeg-decoder:0.3.0'
    implementation 'rapid.decoder:png-decoder:0.3.0'

    implementation 'com.squareup.okhttp3:okhttp:3.9.1'
    //3.14.1 //some ciphers are deprecated on 3.10.0
    implementation 'com.squareup.okio:okio:1.15.0' //2.2.2
    implementation 'com.squareup.duktape:duktape-android:1.1.0' //1.3.0 //1.2.0 adds >4MB
    implementation 'com.github.franmontiel:PersistentCookieJar:v1.0.1'
    implementation 'com.evernote:android-job:1.2.5' //1.2.6, 1.3.0-rc1
    implementation 'ch.acra:acra:4.9.2' //4.11
    //implementation 'ch.acra:acra-core:5.3.0'

    githubImplementation 'com.google.android.gms:play-services-base:11.0.4' //16.1.0

    // for host-based testing
    testImplementation 'junit:junit:4.13-beta-2'
    testImplementation 'org.robolectric:robolectric:4.0-beta-1' //4.2.1, 4.3-alpha-2
    testImplementation 'androidx.test:core:1.2.0-alpha04'
    androidTestImplementation "com.android.support:support-annotations:$ANDROID_SUPPORT"
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
    androidTestImplementation 'com.android.support.test:rules:1.0.2'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'junit:junit:4.13-beta-2'
}
